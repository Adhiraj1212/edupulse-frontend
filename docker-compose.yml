services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      AUTH_UPSTREAM: "host.docker.internal:4000"
      BACKEND_UPSTREAM: "host.docker.internal:5000"
      AUDIT_UPSTREAM: "host.docker.internal:6000"
      DNS_RESOLVER: "127.0.0.11"
      TRUSTED_PROXY_CIDR: "127.0.0.1/32"
    extra_hosts:
      - "host.docker.internal:host-gateway"

