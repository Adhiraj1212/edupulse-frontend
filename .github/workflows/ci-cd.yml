name: frontend-ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVICE_NAME: frontend

jobs:
  security-and-build:
    name: Security Scan, Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Secret Scanning
      - name: Secret Scan (Gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --no-banner --verbose

      # 2. Dockerfile Linting
      - name: Dockerfile Lint (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

      # 3. Docker Setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build Test Image
      - name: Build Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.SERVICE_NAME }}:ci
          cache-from: type=gha,scope=${{ env.SERVICE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.SERVICE_NAME }}

      # 5. Config Validation
      - name: Validate Nginx Configuration
        run: docker run --rm ${{ env.SERVICE_NAME }}:ci nginx -t

      # 6. Container Vulnerability Scanning
      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SERVICE_NAME }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      # 7. Generate CycloneDX SBOM
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SERVICE_NAME }}:ci
          format: cyclonedx
          output: sbom-${{ env.SERVICE_NAME }}.cdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ env.SERVICE_NAME }}
          path: sbom-${{ env.SERVICE_NAME }}.cdx.json
          retention-days: 90

      # 8. Log in to GHCR
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 9. Push Image to GHCR
      - name: Push Image to GHCR
        id: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          docker tag "${{ env.SERVICE_NAME }}:ci" "${IMAGE}:${GITHUB_SHA}"
          docker tag "${{ env.SERVICE_NAME }}:ci" "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")
          echo "image_ref=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "pushed \`${IMAGE}:${GITHUB_SHA}\` (\`${DIGEST}\`)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to EC2 over SSM
    needs: security-and-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::265020546803:role/GitHubActions-devops-ec2ssm-github-Role-Adhiraj' }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}

      - name: Deploy Image via AWS SSM
        run: |
          bash scripts/ssm-run.sh "${{ env.SERVICE_NAME }}" "${{ needs.security-and-build.outputs.image_ref }}" "${{ vars.INSTANCE_ID || 'i-06d3ce74e7868fc6d' }}" "${GITHUB_SHA}"
